name: Verify shared release
on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install isolated test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
      - name: Repository directory policy
        run: bash tools/verify-repository.sh
      - name: Unit, package and archive E2E tests with 100 percent coverage
        run: bash tools/test.sh -q
      - name: Check shared content and versions
        run: bash tools/verify.sh
      - name: Prove malformed skill headers are rejected
        run: bash tools/verify.sh --self-test
      - name: Require a version increase for pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          previous="$(git show "$BASE_SHA:plugins/convertia/VERSION" 2>/dev/null || git show "$BASE_SHA:VERSION")"
          PREVIOUS_VERSION="$previous" bash tools/verify.sh
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat plugins/convertia/VERSION)"
      - name: Require a version increase on main updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          previous="$(git show "$PREVIOUS_SHA:plugins/convertia/VERSION" 2>/dev/null || git show "$PREVIOUS_SHA:VERSION")"
          PREVIOUS_VERSION="$previous" bash tools/verify.sh
      - name: Read-only published-release API and connection tests
        run: .venv/bin/python -m pytest tests_live -q
      - name: Package the exact candidate commit
        run: |
          mkdir -p dist
          git -C plugins/convertia archive --format=zip --output=../../dist/convertia.zip "$GITHUB_SHA"
          bash tools/verify-archive.sh dist/convertia.zip . "$GITHUB_SHA"
          sha256sum dist/convertia.zip > dist/convertia.zip.sha256
          .venv/bin/python -m zipfile -e dist/convertia.zip dist/plugin
      - name: Official validators on the actual extracted candidate
        run: bash tools/verify-official.sh dist/plugin
      - name: Upload verified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: convertia-${{ github.sha }}
          path: |
            dist/convertia.zip
            dist/convertia.zip.sha256
          if-no-files-found: error
  distribute:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: convertia-distribution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Publish verified source subtree without force
        run: bash tools/publish-distribution.sh "$GITHUB_SHA"
