name: Verify shared release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check shared content and versions
        run: bash tools/verify.sh
      - name: Prove malformed skill headers are rejected
        run: bash tools/verify.sh --self-test
      - name: Require a version increase for pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          export PREVIOUS_VERSION="$(git show "$BASE_SHA:VERSION")"
          bash tools/verify.sh
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Require a version increase on main updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          export PREVIOUS_VERSION="$(git show "$PREVIOUS_SHA:VERSION")"
          bash tools/verify.sh
